openapi: 3.0.3
info:
  title: 在线考试平台 API
  version: 1.0.0
  description: 在线考试平台统一采用 `/api/v1` 前缀，响应格式为 `{code,message,data}`。
servers:
  - url: http://localhost:19502
    description: Docker Compose 暴露的后端端口

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, name, role]
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, teacher]
    Question:
      type: object
      properties:
        type:
          type: string
          enum: [single, multiple, true_false, fill_blank, short_answer]
        content:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              text:
                type: string
        answer: {}
        analysis:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        knowledge_point:
          type: string
        score:
          type: number

paths:
  /healthz:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
  /api/v1/auth/register:
    post:
      summary: 注册学生或教师账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
  /api/v1/auth/login:
    post:
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回 token 和用户信息
  /api/v1/questions:
    get:
      summary: 分页查询题库
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: difficulty
          schema:
            type: string
        - in: query
          name: knowledge_point
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        '200':
          description: 题目列表
    post:
      summary: 新建题目
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
      responses:
        '201':
          description: 创建成功
  /api/v1/exams:
    post:
      summary: 创建考试并自动组卷
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, duration_minutes, question_config]
              properties:
                title:
                  type: string
                duration_minutes:
                  type: integer
                total_score:
                  type: number
                question_config:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      count:
                        type: integer
                      score:
                        type: number
                      difficulty:
                        type: string
      responses:
        '201':
          description: 创建成功
  /api/v1/exams/{id}/makeup:
    get:
      summary: 查询当前学生的补考资格与申请状态
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 返回 eligible、can_apply、message、effective_score 及最近一条申请
    post:
      summary: 申请补考（缺考或低于总分 60% 可申请一次）
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: 申请成功，进入待审核
        '409':
          description: 重复申请、待审核中或补考进行中
  /api/v1/exams/{id}/makeup-requests:
    get:
      summary: 教师查看某场考试的补考申请列表
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 申请列表
  /api/v1/makeup-requests/{id}/approve:
    post:
      summary: 批准补考申请并生成独立补考记录（并发批准只成功一次）
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已批准
        '409':
          description: 申请已被处理
  /api/v1/makeup-requests/{id}/reject:
    post:
      summary: 拒绝补考申请
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已拒绝
        '409':
          description: 申请已被处理
